
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermitFlow - Building Permit & Architectural Design Platform</title>
    <meta name="description" content="A comprehensive building permit and architectural design platform featuring automated onboarding, project tracking, and AI-powered permit roadmap generation.">
    <meta property="og:title" content="PermitFlow - Building Permit & Architectural Design Platform">
    <meta property="og:description" content="A comprehensive building permit and architectural design platform featuring automated onboarding, project tracking, and AI-powered permit roadmap generation.">
    <meta name="theme-color" content="#148E80">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#0F6B61",
                        "primary-dark": "#0B5A51",
                        "accent-dark": "#0B1120",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1F2937",
                    },
                    screens: {
                        xs: '420px',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(100%)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-padding-top: 6rem;
        }
        ::placeholder {
            color: #4B5563;
            opacity: 1;
        }
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid #0F6B61 !important;
            outline-offset: 2px;
        }
        .dark a:focus-visible,
        .dark button:focus-visible,
        .dark input:focus-visible,
        .dark select:focus-visible,
        .dark textarea:focus-visible,
        .dark [tabindex]:focus-visible {
            outline-color: #5EEAD4 !important;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
        }
        .step-connector::after {
            content: '';
            position: absolute;
            top: 1.25rem;
            left: 50%;
            width: 100%;
            height: 2px;
            background-color: #E5E7EB;
            z-index: 0;
        }
        .step-connector-active::after {
            background-color: #148E80;
        }
        .shimmer-bg {
            background: linear-gradient(90deg, transparent, rgba(20, 142, 128, 0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }
        .dark .glass-card {
            background: rgba(31, 41, 55, 0.8);
        }
        .skip-link {
            position: fixed;
            top: -6rem;
            left: 0.75rem;
            z-index: 300;
        }
        .skip-link:focus {
            top: 0.75rem;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .shimmer-bg {
                animation: none !important;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>


</head>
<body class="bg-[#FAFAFA] dark:bg-[#0B1120] text-gray-900 dark:text-gray-100 antialiased font-sans">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
